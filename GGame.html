<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜兩位數遊戲</title>
    <!-- 引入 Tailwind CSS 確保響應式與美觀的 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 QRCode.js 用於生成 QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* 隱藏數字輸入框的上下箭頭 (Chrome, Safari, Edge, Opera) */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* 隱藏數字輸入框的上下箭頭 (Firefox) */
        input[type=number] {
            -moz-appearance: textfield;
        }
        /* 隱藏滾動條但保持可滾動 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden">
        <!-- 標題區 -->
        <div class="bg-indigo-600 p-6 text-white">
            <div class="flex justify-between items-start w-full gap-2">
                <!-- 左側佔位，用於在大螢幕時幫助標題完美置中 -->
                <div class="w-20 hidden sm:block"></div>
                
                <!-- 標題區塊 -->
                <div class="flex-1 text-left sm:text-center mt-1">
                    <h1 id="mainTitle" class="text-2xl sm:text-3xl font-bold mb-1 tracking-tight">猜兩位數遊戲</h1>
                    <p id="subTitle" class="text-indigo-200 text-xs sm:text-sm">系統已產生一個 10 - 99 的數字</p>
                </div>
                
                <!-- 右側按鈕群 -->
                <div class="flex gap-2 shrink-0 sm:w-20 justify-end">
                    <button id="langBtn" class="bg-indigo-500 hover:bg-indigo-400 rounded-full transition-colors text-sm font-bold w-9 h-9 flex items-center justify-center shadow-sm" title="切換語言 / Switch Language">
                        EN
                    </button>
                    <button id="shareBtn" class="bg-indigo-500 hover:bg-indigo-400 rounded-full transition-colors w-9 h-9 flex items-center justify-center shadow-sm" title="分享遊戲">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- 規則說明區塊 (可折疊) -->
            <div class="bg-indigo-700 rounded-lg text-left text-sm text-indigo-100 mt-5 shadow-inner overflow-hidden">
                <button id="ruleToggleBtn" class="w-full flex justify-between items-center px-4 py-3 font-bold text-indigo-50 hover:bg-indigo-800 transition-colors focus:outline-none">
                    <span id="ruleTitle">💡 規則說明：</span>
                    <svg id="ruleIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform transition-transform duration-300 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <!-- 利用 grid 進行順滑動畫折疊 -->
                <div id="ruleContentWrapper" class="grid transition-all duration-300" style="grid-template-rows: 1fr;">
                    <div class="overflow-hidden">
                        <ul class="list-disc list-inside space-y-1 opacity-90 px-4 pb-3">
                            <li id="rule1">輸入 10-99 的數字進行猜測。</li>
                            <li id="rule2">系統會提示你有幾個位數完全正確 (數字與位置皆對)。</li>
                            <li id="rule3">利用線索，用最少次數猜中答案！</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-6 text-gray-800">
            <!-- 狀態提示訊息 -->
            <div id="message" class="text-center text-gray-600 mb-6 font-medium h-6 transition-colors duration-300">
                請輸入一個兩位數來開始遊戲！
            </div>

            <!-- 輸入區 -->
            <div class="flex gap-3 mb-6">
                <input 
                    type="number" 
                    id="guessInput" 
                    min="10" 
                    max="99" 
                    placeholder="例如: 42" 
                    class="flex-1 border-2 border-gray-300 rounded-lg px-4 py-3 text-2xl text-center focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors"
                    autocomplete="off"
                >
                <button 
                    id="submitBtn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                    猜測
                </button>
            </div>

            <!-- 重新開始按鈕 (預設隱藏) -->
            <button 
                id="restartBtn" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-md hidden mb-6"
            >
                再玩一次
            </button>

            <!-- 歷史紀錄區 -->
            <div class="border-t border-gray-200 pt-4 mt-2">
                <h2 class="text-lg font-semibold text-gray-700 mb-3 flex items-center justify-between">
                    <span id="historyTitleText">猜測紀錄</span>
                    <span id="attemptCount" class="text-sm bg-indigo-100 text-indigo-800 py-1 px-3 rounded-full font-bold">第 0 次</span>
                </h2>
                
                <div class="bg-gray-50 rounded-lg max-h-48 overflow-y-auto border border-gray-200 p-2 hide-scrollbar shadow-inner">
                    <ul id="historyList" class="space-y-2">
                        <li class="text-center text-gray-400 py-3" id="emptyHistory">
                            尚未有猜測紀錄
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 分享 QR Code Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 shadow-2xl" id="qrModalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 id="shareModalTitle" class="text-xl font-bold text-gray-800 tracking-tight">分享遊戲</h3>
                <button id="closeQrBtn" class="text-gray-500 hover:text-gray-700 transition-colors rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="flex flex-col items-center">
                <div id="qrcode" class="mb-4 p-4 bg-white border-2 border-indigo-50 rounded-xl shadow-sm"></div>
                <p id="shareModalDesc" class="text-sm text-gray-500 mb-4 text-center leading-relaxed">掃描上方 QR Code<br>或複製下方連結與朋友一起玩！</p>
                <div class="flex w-full gap-2">
                    <input type="text" id="shareUrlInput" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none" readonly>
                    <button id="copyUrlBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors shadow-sm">複製</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 語言與翻譯設定
        let currentLang = 'zh';
        const t = {
            zh: {
                pageTitle: "猜兩位數遊戲",
                title: "猜兩位數遊戲",
                subtitle: "系統已產生一個 10 - 99 的數字",
                initMsg: "請輸入一個兩位數來開始遊戲！",
                placeholder: "例如: 42",
                guessBtn: "猜測",
                restartBtn: "再玩一次",
                historyTitle: "猜測紀錄",
                attemptCount0: "第 0 次",
                emptyHistory: "尚未有猜測紀錄",
                shareTitle: "分享遊戲",
                shareDesc: "掃描上方 QR Code<br>或複製下方連結與朋友一起玩！",
                copyBtn: "複製",
                copiedBtn: "已複製!",
                errorMsg: "請輸入有效的兩位數正整數 (10-99)！",
                winMsg: "🎉 恭喜你答對了！答案就是 ",
                wrongMsg: "不正確，請參考下方提示繼續猜測！",
                correctDigits: "正確位數: ",
                digitsUnit: " 個",
                attemptsPrefix: "共 ",
                attemptsSuffix: " 次",
                shareTooltip: "分享遊戲",
                langToggleText: "EN",
                ruleTitle: "💡 規則說明：",
                rule1: "輸入 10-99 的數字進行猜測。",
                rule2: "系統會提示你有幾個位數完全正確 (數字與位置皆對)。",
                rule3: "利用線索，用最少次數猜中答案！"
            },
            en: {
                pageTitle: "Guess 2-Digit Number",
                title: "Guess the Number",
                subtitle: "A number between 10 - 99 is generated",
                initMsg: "Enter a 2-digit number to start!",
                placeholder: "e.g. 42",
                guessBtn: "Guess",
                restartBtn: "Play Again",
                historyTitle: "Guess History",
                attemptCount0: "0 Attempts",
                emptyHistory: "No guesses yet",
                shareTitle: "Share Game",
                shareDesc: "Scan the QR Code above<br>or copy the link below to play!",
                copyBtn: "Copy",
                copiedBtn: "Copied!",
                errorMsg: "Please enter a valid 2-digit number (10-99)!",
                winMsg: "🎉 Congrats! The answer is ",
                wrongMsg: "Incorrect, check the hint below and keep guessing!",
                correctDigits: "Correct digits: ",
                digitsUnit: "",
                attemptsPrefix: "",
                attemptsSuffix: " Attempts",
                shareTooltip: "Share Game",
                langToggleText: "中",
                ruleTitle: "💡 How to play:",
                rule1: "Enter a number between 10-99.",
                rule2: "The system tells you how many digits are perfectly matched.",
                rule3: "Use the hints to guess the answer in the fewest attempts!"
            }
        };

        // 遊戲變數
        let targetNumber = 0;
        let attempts = 0;
        let isGameOver = false;
        let currentMessageKey = 'initMsg';
        let historyData = [];
        let isRulesExpanded = true; 
        let hasGuessed = false;     

        // 取得 DOM 元素
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const restartBtn = document.getElementById('restartBtn');
        const messageEl = document.getElementById('message');
        const historyList = document.getElementById('historyList');
        const attemptCount = document.getElementById('attemptCount');
        
        // 多語系標籤 DOM
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const historyTitleText = document.getElementById('historyTitleText');
        const shareModalTitle = document.getElementById('shareModalTitle');
        const shareModalDesc = document.getElementById('shareModalDesc');
        const langBtn = document.getElementById('langBtn');
        const ruleTitle = document.getElementById('ruleTitle');
        const rule1 = document.getElementById('rule1');
        const rule2 = document.getElementById('rule2');
        const rule3 = document.getElementById('rule3');
        
        // 折疊規則相關 DOM
        const ruleToggleBtn = document.getElementById('ruleToggleBtn');
        const ruleContentWrapper = document.getElementById('ruleContentWrapper');
        const ruleIcon = document.getElementById('ruleIcon');

        // QR Code 相關元素
        const shareBtn = document.getElementById('shareBtn');
        const qrModal = document.getElementById('qrModal');
        const qrModalContent = document.getElementById('qrModalContent');
        const closeQrBtn = document.getElementById('closeQrBtn');
        const qrcodeContainer = document.getElementById('qrcode');
        const shareUrlInput = document.getElementById('shareUrlInput');
        const copyUrlBtn = document.getElementById('copyUrlBtn');
        let qrcodeInstance = null;

        function updateUI() {
            const lang = t[currentLang];
            
            document.title = lang.pageTitle;
            mainTitle.textContent = lang.title;
            subTitle.textContent = lang.subtitle;
            guessInput.placeholder = lang.placeholder;
            submitBtn.textContent = lang.guessBtn;
            restartBtn.textContent = lang.restartBtn;
            historyTitleText.textContent = lang.historyTitle;
            shareModalTitle.textContent = lang.shareTitle;
            shareModalDesc.innerHTML = lang.shareDesc;
            
            if (copyUrlBtn.textContent !== t.zh.copiedBtn && copyUrlBtn.textContent !== t.en.copiedBtn) {
                copyUrlBtn.textContent = lang.copyBtn;
            }
            shareBtn.title = lang.shareTooltip;
            langBtn.textContent = lang.langToggleText;

            ruleTitle.textContent = lang.ruleTitle;
            rule1.textContent = lang.rule1;
            rule2.textContent = lang.rule2;
            rule3.textContent = lang.rule3;

            if (currentMessageKey === 'winMsg') {
                messageEl.textContent = lang.winMsg + targetNumber + "！";
            } else {
                messageEl.textContent = lang[currentMessageKey];
            }

            if (attempts === 0) {
                attemptCount.textContent = lang.attemptCount0;
            } else {
                attemptCount.textContent = lang.attemptsPrefix + attempts + lang.attemptsSuffix;
            }

            renderHistoryList(false); 
        }

        function toggleRules(forceCollapse = false, forceExpand = false) {
            if (forceCollapse) isRulesExpanded = false;
            else if (forceExpand) isRulesExpanded = true;
            else isRulesExpanded = !isRulesExpanded;

            if (isRulesExpanded) {
                ruleContentWrapper.style.gridTemplateRows = '1fr';
                ruleIcon.classList.add('rotate-180');
            } else {
                ruleContentWrapper.style.gridTemplateRows = '0fr';
                ruleIcon.classList.remove('rotate-180');
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        function initGame() {
            targetNumber = Math.floor(Math.random() * 90) + 10;
            attempts = 0;
            isGameOver = false;
            currentMessageKey = 'initMsg';
            historyData = [];
            hasGuessed = false; 

            guessInput.value = '';
            guessInput.disabled = false;
            submitBtn.disabled = false;
            restartBtn.classList.add('hidden');
            
            messageEl.className = 'text-center text-gray-600 mb-6 font-medium h-6 transition-colors duration-300';
            
            updateUI();
            toggleRules(false, true); 
            guessInput.focus();
        }

        function processGuess() {
            if (isGameOver) return;

            const guessValue = guessInput.value;

            if (!guessValue || guessValue < 10 || guessValue > 99 || !Number.isInteger(Number(guessValue))) {
                setGameMessage('errorMsg', 'text-red-500 font-bold');
                guessInput.classList.add('animate-pulse');
                setTimeout(() => guessInput.classList.remove('animate-pulse'), 500);
                return;
            }

            const guessNum = parseInt(guessValue, 10);
            attempts++;
            
            if (!hasGuessed) {
                hasGuessed = true;
                toggleRules(true, false);
            }
            
            const targetTens = Math.floor(targetNumber / 10);
            const targetUnits = targetNumber % 10;
            const guessTens = Math.floor(guessNum / 10);
            const guessUnits = guessNum % 10;
            
            let totalCorrect = (targetTens === guessTens ? 1 : 0) + (targetUnits === guessUnits ? 1 : 0);

            if (guessNum === targetNumber) {
                isGameOver = true;
                setGameMessage('winMsg', 'text-emerald-600 font-bold text-xl');
                guessInput.disabled = true;
                submitBtn.disabled = true;
                restartBtn.classList.remove('hidden');
            } else {
                setGameMessage('wrongMsg', 'text-amber-600 font-bold');
            }

            historyData.unshift({ guess: guessNum, correct: totalCorrect, win: guessNum === targetNumber });
            renderHistoryList(true); 

            guessInput.value = '';
            if (!isGameOver) {
                guessInput.focus();
            }
        }

        function setGameMessage(key, classes) {
            currentMessageKey = key;
            messageEl.className = `text-center mb-6 h-6 transition-colors duration-300 ${classes}`;
            if (key === 'winMsg') {
                messageEl.textContent = t[currentLang].winMsg + targetNumber + "！";
            } else {
                messageEl.textContent = t[currentLang][key];
            }
        }

        function renderHistoryList(animateFirst = false) {
            const lang = t[currentLang];
            historyList.innerHTML = '';
            
            if (historyData.length === 0) {
                historyList.innerHTML = `<li class="text-center text-gray-400 py-3" id="emptyHistory">${lang.emptyHistory}</li>`;
                return;
            }

            historyData.forEach((record, index) => {
                const li = document.createElement('li');
                const bgClass = record.win ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-gray-100';
                const iconClass = record.win ? 'text-emerald-500' : 'text-indigo-500';

                if (index === 0 && animateFirst) {
                    li.className = `${bgClass} border rounded-lg p-3 px-4 flex items-center justify-between shadow-sm transform transition-all duration-300 opacity-0 -translate-y-2`;
                } else {
                    li.className = `${bgClass} border rounded-lg p-3 px-4 flex items-center justify-between shadow-sm transform transition-all duration-300`;
                }
                
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-mono text-2xl font-bold ${iconClass} w-8 text-center">${record.guess}</span>
                    </div>
                    <div class="text-sm flex gap-2">
                        <span class="px-3 py-1.5 rounded-lg ${record.correct > 0 ? 'text-blue-700 font-bold bg-blue-100' : 'text-gray-500 bg-gray-100'}">
                            ${lang.correctDigits}${record.correct}${lang.digitsUnit}
                        </span>
                    </div>
                `;

                historyList.appendChild(li);

                if (index === 0 && animateFirst) {
                    setTimeout(() => {
                        li.classList.remove('opacity-0', '-translate-y-2');
                    }, 10);
                }
            });
            
            attemptCount.textContent = lang.attemptsPrefix + attempts + lang.attemptsSuffix;
        }

        // --- 分享功能邏輯 (自動抓取部署網址) ---
        function openShareModal() {
            // 動態取得目前網頁的真實 URL
            const currentUrl = window.location.href;
            shareUrlInput.value = currentUrl;
            
            if (!qrcodeInstance) {
                qrcodeInstance = new QRCode(qrcodeContainer, {
                    text: currentUrl,
                    width: 180,
                    height: 180,
                    colorDark : "#4F46E5",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                qrcodeInstance.clear();
                qrcodeInstance.makeCode(currentUrl);
            }

            qrModal.classList.remove('hidden');
            void qrModal.offsetWidth; 
            qrModal.classList.remove('opacity-0');
            qrModalContent.classList.remove('scale-95');
        }

        function closeShareModal() {
            qrModal.classList.add('opacity-0');
            qrModalContent.classList.add('scale-95');
            setTimeout(() => {
                qrModal.classList.add('hidden');
            }, 300); 
        }

        function copyUrl() {
            shareUrlInput.select();
            document.execCommand('copy');
            
            copyUrlBtn.textContent = t[currentLang].copiedBtn;
            copyUrlBtn.classList.replace('bg-indigo-600', 'bg-emerald-500');
            copyUrlBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-600');
            
            setTimeout(() => {
                copyUrlBtn.textContent = t[currentLang].copyBtn;
                copyUrlBtn.classList.replace('bg-emerald-500', 'bg-indigo-600');
                copyUrlBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-indigo-700');
            }, 2000);
        }

        // 事件監聽器
        submitBtn.addEventListener('click', processGuess);
        restartBtn.addEventListener('click', initGame);
        langBtn.addEventListener('click', toggleLanguage);
        ruleToggleBtn.addEventListener('click', () => toggleRules()); 
        
        shareBtn.addEventListener('click', openShareModal);
        closeQrBtn.addEventListener('click', closeShareModal);
        copyUrlBtn.addEventListener('click', copyUrl);
        
        qrModal.addEventListener('click', function(e) {
            if (e.target === qrModal) {
                closeShareModal();
            }
        });

        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processGuess();
            }
        });

        // 啟動遊戲
        initGame();
    </script>
</body>
</html>
